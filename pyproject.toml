[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parikshak"
version = "0.1.0"
description = "Console exam response tracker with live timer, per-question timing, autosave and CSV export"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Environment :: Console",
]

[project.scripts]
parikshak = "parikshak.app:main"

[tool.setuptools]
packages = ["parikshak"]
